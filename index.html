<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>午間點唱 🎵 傳遞心意</title>
    <style>
        /* 暖心視覺設計 */
        :root {
            --bg-color: #FFFBF0; 
            --primary-color: #FFA69E; 
            --secondary-color: #AEDBCE; 
            --text-main: #5D576B; 
            --text-light: #8D879B;
            --card-bg: #FFFFFF;
        }
        * { box-sizing: border-box; font-family: 'PingFang HK', sans-serif; margin: 0; padding: 0; user-select: none; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
        #app { width: 100%; max-width: 800px; padding: 20px; position: relative; }
        .view { display: none; animation: fadeIn 0.4s ease-in-out; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        h1 { text-align: center; color: var(--primary-color); font-size: 28px; margin-bottom: 10px; font-weight: 600; }
        p.subtitle { text-align: center; color: var(--text-light); font-size: 16px; margin-bottom: 30px; }
        .btn { background-color: var(--primary-color); color: white; border: none; border-radius: 25px; padding: 12px 24px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(255, 166, 158, 0.4); transition: transform 0.1s; text-align: center; }
        .btn:active { transform: scale(0.95); }
        .btn-secondary { background-color: var(--secondary-color); color: var(--text-main); box-shadow: 0 4px 10px rgba(174, 219, 206, 0.4); }

        .home-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; gap: 20px; }
        .quote { font-size: 20px; color: var(--text-main); margin: 20px 0 40px; padding: 20px; background: var(--card-bg); border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.03); position: relative; }
        .quote::before { content: '✨'; position: absolute; top: -10px; left: -10px; font-size: 24px; }
        
        .admin-gear-btn { position: absolute; top: 20px; right: 20px; width: 44px; height: 44px; font-size: 24px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; opacity: 0.4; cursor: pointer; }
        
        .song-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .song-card { background-color: var(--card-bg); border-radius: 20px; padding: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.04); display: flex; flex-direction: column; gap: 10px; cursor: pointer; border: 2px solid transparent; }
        .song-title { font-size: 20px; font-weight: bold; color: var(--text-main); }
        .song-artist { font-size: 14px; color: var(--text-light); }
        .vote-btn-container { margin-top: auto; text-align: right; }
        .vote-icon { font-size: 24px; color: var(--primary-color); }
        .back-btn { background: none; color: var(--text-light); border: none; font-size: 16px; margin-bottom: 20px; cursor: pointer; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(5px); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: var(--card-bg); padding: 40px; border-radius: 30px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .modal-content h2 { color: var(--primary-color); margin-bottom: 10px; }
        .modal-icon { font-size: 50px; margin-bottom: 15px; }

        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .admin-controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .admin-song-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: var(--card-bg); border-radius: 15px; margin-bottom: 10px; }
        .song-info input { border: 1px solid #ddd; border-radius: 8px; padding: 8px; margin-right: 5px; font-size: 14px; }
        .danger-btn { background-color: #FF6B6B; color: white; padding: 6px 12px; border: none; border-radius: 15px; cursor: pointer; }
        
        .stat-bar-container { width: 150px; height: 10px; background: #eee; border-radius: 5px; overflow: hidden; margin-top: 5px; }
        .stat-bar { height: 100%; background: var(--secondary-color); width: 0%; }
        .login-box { text-align: center; margin-top: 20vh; }
        .login-box input { padding: 10px; font-size: 20px; text-align: center; border: 2px solid var(--primary-color); border-radius: 10px; margin-bottom: 15px; width: 200px; }
        
        /* 載入中動畫 */
        #loading { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--primary-color); color: white; padding: 10px 20px; border-radius: 20px; z-index: 999; }
    </style>
</head>
<body>

    <div id="loading">載入雲端資料中... ⏳</div>

    <div id="app">
        <!-- 首頁 -->
        <div id="view-home" class="view active">
            <button class="admin-gear-btn" onclick="switchView('view-login')" title="管理員登入">⚙️</button>
            <div class="home-container">
                <h1>🎵 午間點唱站</h1>
                <div class="quote">「讀書辛苦了，點一首歌讓心靈放鬆一下吧！」💖</div>
                <button class="btn" onclick="loadAndShowVoterView()">我要點唱</button>
            </div>
        </div>

        <!-- 學生投票介面 -->
        <div id="view-voter" class="view">
            <button class="back-btn" onclick="switchView('view-home')">← 返回首頁</button>
            <h1>本週候選歌曲</h1>
            <p class="subtitle">點擊你最想聽的歌曲卡片即可投票</p>
            <div class="song-list" id="voter-song-list"></div>
        </div>

        <!-- 管理員登入 -->
        <div id="view-login" class="view">
            <button class="back-btn" onclick="switchView('view-home')">← 返回首頁</button>
            <div class="login-box">
                <h1>管理員登入</h1>
                <p class="subtitle">請輸入密碼 (首次使用預設: 1234)</p>
                <input type="password" id="admin-pwd" placeholder="密碼">
                <br>
                <button class="btn" onclick="login()">進入後台</button>
            </div>
        </div>

        <!-- 管理員儀表板 -->
        <div id="view-admin" class="view">
            <div class="admin-header">
                <h1>⚙️ 控制中心</h1>
                <button class="btn btn-secondary" onclick="switchView('view-home')">登出返回</button>
            </div>
            <div class="admin-controls">
                <button class="btn btn-secondary" onclick="exportCSV()">📥 匯出 Excel</button>
                <button class="btn btn-secondary" onclick="changePassword()">🔑 更改密碼</button>
                <button class="btn" style="background:#FFD166; color:#5D576B;" onclick="resetVotes()">🔄 票數歸零</button>
                <button class="btn" onclick="addNewSong()">➕ 新增歌曲</button>
                <button class="btn" style="background:#AEDBCE; color:#5D576B;" onclick="syncToCloud()">☁️ 儲存變更至雲端</button>
            </div>
            <div id="admin-song-list"></div>
        </div>
    </div>

    <!-- 感謝投票彈窗 -->
    <div id="thank-you-modal" class="modal">
        <div class="modal-content">
            <div class="modal-icon">✨🎶✨</div>
            <h2>投票成功！</h2>
            <p>已收到你的心意，祝你有美好的一天！</p>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚠️ 請將下方的引號內容替換為你的 Google Apps Script 網址
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx0zsUzIiHYgU5g67o6qXxjOt38OWnFTngn6PLSKdjAr1t_6BcJqrgC6rj4Brfq3p-WjQ/exec';
        // ==========================================

        let songs = [];
        let isVoting = false;

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        // 從 Google Sheets 載入資料
        async function fetchSongs() {
            if(SCRIPT_URL.includes('請在這裡貼上')) {
                alert('請先在 HTML 檔案中設定 Google Apps Script 網址！');
                return;
            }
            showLoading(true);
            try {
                const response = await fetch(SCRIPT_URL);
                songs = await response.json();
            } catch (error) {
                alert('載入資料失敗，請檢查網路連線。');
            }
            showLoading(false);
        }

        async function loadAndShowVoterView() {
            await fetchSongs();
            renderVoterSongs();
            switchView('view-voter');
        }

        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function renderVoterSongs() {
            const list = document.getElementById('voter-song-list');
            list.innerHTML = '';
            songs.forEach(song => {
                const card = document.createElement('div');
                card.className = 'song-card';
                card.onclick = () => castVote(song.id);
                card.innerHTML = `
                    <div class="song-title">${song.title}</div>
                    <div class="song-artist">🎤 ${song.artist}</div>
                    <div class="vote-btn-container"><span class="vote-icon">🤍</span></div>
                `;
                list.appendChild(card);
            });
        }

        // 投票並傳送至雲端
        async function castVote(id) {
            if (isVoting) return; // 防止連點
            isVoting = true;
            showLoading(true);

            try {
                await fetch(SCRIPT_URL + "?action=vote&id=" + id);
                
                // 顯示暖心彈窗
                const modal = document.getElementById('thank-you-modal');
                modal.style.display = 'flex';
                setTimeout(() => {
                    modal.style.display = 'none';
                    switchView('view-home');
                }, 2500);
            } catch (error) {
                alert('投票失敗，請再試一次。');
            }
            showLoading(false);
            isVoting = false;
        }

        // --- 管理員邏輯 ---
        function login() {
            const pwdInput = document.getElementById('admin-pwd').value;
            const currentPwd = localStorage.getItem('adminPassword') || '1234';
            if (pwdInput === currentPwd) { 
                document.getElementById('admin-pwd').value = '';
                loadAndShowAdminView();
            } else { alert('密碼錯誤！'); }
        }

        function changePassword() {
            const newPwd = prompt('請輸入新密碼:');
            if (newPwd) {
                localStorage.setItem('adminPassword', newPwd.trim());
                alert('密碼已成功更改！');
            }
        }

        async function loadAndShowAdminView() {
            await fetchSongs();
            renderAdminSongs();
            switchView('view-admin');
        }

        function renderAdminSongs() {
            const list = document.getElementById('admin-song-list');
            list.innerHTML = '';
            const maxVotes = Math.max(...songs.map(s => s.votes), 1);

            songs.forEach(song => {
                const item = document.createElement('div');
                item.className = 'admin-song-item';
                const percent = (song.votes / maxVotes) * 100;
                item.innerHTML = `
                    <div class="song-info">
                        <input type="text" value="${song.title}" onchange="updateLocalSong(${song.id}, 'title', this.value)">
                        <input type="text" value="${song.artist}" onchange="updateLocalSong(${song.id}, 'artist', this.value)">
                        <div style="font-size: 12px; color: #888; margin-top:5px;">得票數: ${song.votes}</div>
                        <div class="stat-bar-container"><div class="stat-bar" style="width: ${percent}%"></div></div>
                    </div>
                    <button class="danger-btn" onclick="deleteSong(${song.id})">刪除</button>
                `;
                list.appendChild(item);
            });
        }

        function updateLocalSong(id, field, value) {
            const song = songs.find(s => s.id === id);
            if (song) song[field] = value;
        }

        function addNewSong() {
            const newId = songs.length > 0 ? Math.max(...songs.map(s => Number(s.id))) + 1 : 1;
            songs.push({ id: newId, title: '新歌曲', artist: '未知歌手', votes: 0 });
            renderAdminSongs();
        }

        function deleteSong(id) {
            if (confirm('確定要刪除這首歌嗎？')) {
                songs = songs.filter(s => s.id !== id);
                renderAdminSongs();
            }
        }

        function resetVotes() {
            if (confirm('這將會把所有歌曲的票數歸零。確定要繼續嗎？')) {
                songs.forEach(s => s.votes = 0);
                renderAdminSongs();
            }
        }

        // 同步整個列表到 Google Sheets
        async function syncToCloud() {
            showLoading(true);
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'sync', songs: songs })
                });
                alert('成功儲存變更至雲端！');
            } catch (error) {
                alert('同步失敗，請確認你的 Apps Script 網址正確。');
            }
            showLoading(false);
        }

        // 匯出 CSV (保留原功能，方便單獨備份)
        function exportCSV() {
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
            csvContent += "歌曲名稱,歌手,得票數\n";
            const sortedSongs = [...songs].sort((a, b) => b.votes - a.votes);
            sortedSongs.forEach(s => {
                csvContent += `"${s.title}","${s.artist}",${s.votes}\n`;
            });
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csvContent));
            link.setAttribute("download", `午間點唱_結果_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
